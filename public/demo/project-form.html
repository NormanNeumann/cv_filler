<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>简历匣 · 项目字段测试</title><link rel="stylesheet" href="form.css"></head><body><main><div class="form-intro"><span>RESUME POCKET / 项目字段测试</span><h2>填写一段项目经历</h2><p>同一份简历有多个项目时，请在侧边栏按项目名称选择各项资料。这个测试表单不会发送数据。</p></div><form><fieldset><legend>项目经历</legend><label>项目名称<input name="projectName"></label><label>职责<input name="projectRole"></label><label>项目时间<input name="projectDates" placeholder="如：2026.09 - 2026.10"></label><label>项目描述<textarea name="projectDescription" rows="3"></textarea></label><label>职责内工作内容<textarea name="projectTasks" rows="3"></textarea></label><label>产出或结果<textarea name="projectResults" rows="3"></textarea></label></fieldset><p id="submit-status" role="status"></p></form></main><script src="form.js"></script></body></html>
