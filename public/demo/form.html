<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Atelier · 加入我们</title><link rel="stylesheet" href="form.css"></head>
<body><header><a class="wordmark" href="#">atelier<span>®</span></a><span>创造有意义的产品。</span><a href="#application">加入我们 ↗</a></header><main><div class="breadcrumb">CAREERS <span>/</span> PRODUCT & ENGINEERING</div><div class="job-heading"><div><span class="hiring">我们正在寻找新伙伴</span><h1>让好想法，<br>成为日常。</h1><p>前端开发工程师 <span>·</span> 上海 / 混合办公 <span>·</span> 全职</p></div><div class="art" aria-hidden="true"><div></div><div></div><div></div><span>Build<br>with care.</span></div></div><section id="application"><div class="form-intro"><span>01 / 申请信息</span><h2>很高兴认识你。</h2><p>告诉我们你的故事，我们会认真阅读每一份申请。</p></div><form><fieldset><legend>基本信息</legend><div class="grid"><label>姓名 <em>*</em><input name="fullName" autocomplete="name" required placeholder="你的姓名"></label><label>电子邮箱 <em>*</em><input name="email" type="email" autocomplete="email" required placeholder="hello@example.com"></label><label>手机号码<input name="phone" type="tel" autocomplete="tel" placeholder="方便联系你的号码"></label><label>所在城市<input name="city" autocomplete="address-level2" placeholder="目前居住的城市"></label><label>最高学历<select name="degree"><option value="">请选择学历</option><option value="bachelor">本科</option><option value="master">硕士</option><option value="phd">博士</option><option value="other">其他</option></select></label><label>出生日期<input name="birthday" type="date" autocomplete="bday"></label></div></fieldset><fieldset><legend>关于你</legend><label>个人简介<textarea name="summary" rows="4" placeholder="你做过什么，想做什么，或者任何想让我们知道的事。"></textarea></label><label>为什么想加入我们？<textarea name="motivation" rows="3" placeholder="是什么吸引了你？"></textarea></label><div class="grid"><label>期望薪资<input name="salary" placeholder="如：25–30K / 月"></label><label>可到岗日期<input name="availableDate" type="date"></label></div></fieldset><p class="demo-notice">这是本地测试表单，内容不会发送。可用右侧简历匣体验识别、填写与记忆。</p><button type="submit" class="submit">提交申请 <span>↗</span></button><p id="submit-status" role="status"></p></form></section><footer>© 2026 ATELIER STUDIO <span>Made with intention.</span></footer></main><script src="form.js"></script></body></html>
